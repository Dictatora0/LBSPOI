<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>高德地图</title>
    <link rel="stylesheet" href="http://cache.amap.com/lbs/static/main1119.css"/>
    <script src="http://cache.amap.com/lbs/static/es5.min.js"></script>
    <script src="http://webapi.amap.com/maps?v=1.4.3&key=e19f4ed4efbab78ff2cea00265c78782&plugin=AMap.PlaceSearch,AMap.AdvancedInfoWindow"></script>
    <script src="//webapi.amap.com/ui/1.0/main.js?v=1.0.11"></script>
    <link rel="stylesheet" href="gaode.css">
</head>
<body>
<div id="container" style="width: 100%; height: 100vh;"></div>
<div>
    <input id="tipinput" class="tipinput" type="text" size="20" placeholder="请输入关键字" autocomplete="off"/>
</div>
<!-- 登录按钮 -->
<button id="show-login-form">登录</button>
<!-- 用户登录表单 -->
<div id="login-form" style="display: none;">
    <h2>登录</h2>
    <form id="login" action="/login" method="post">
        <input type="text" name="username" placeholder="用户名" required>
        <input type="password" name="password" placeholder="密码" required>
        <button type="submit">登录</button>
    </form>
</div>
<!-- 用户个人信息维护表单 -->
<!-- 显示个人信息维护表单的按钮 -->
<button id="show-user-info-form">个人信息维护</button>
<div id="user-info-form" style="display: none;">
    <h2>个人信息维护</h2>
    <form id="user-info" action="/user-info" method="post">
        <input type="text" name="username" placeholder="用户名" required>
        <input type="password" name="password" placeholder="密码" required>
        <input type="email" name="email" placeholder="邮箱" required>
        <button type="submit">保存</button>
    </form>
</div>
<!-- APIKEY获取与管理界面 -->
<!-- 显示APIKEY管理界面的按钮 -->
<button id="show-apikey-management">APIKEY管理</button>
<div id="apikey-management" style="display: none;">
    <h2>APIKEY管理</h2>
    <div>
        <button id="generate-apikey">生成APIKEY</button>
        <button id="revoke-apikey">吊销APIKEY</button>
    </div>
    <div id="apikey-display"></div>
</div>
<!-- POI数据管理界面 -->
<!-- 显示POI数据管理界面的按钮 -->
<button id="show-poi-management">POI数据管理</button>
<div id="poi-management" style="display: none;">
    <h2>POI数据管理</h2>
    <form id="poi-add" action="/poi-add" method="post">
        <input type="text" name="name" placeholder="名称" required>
        <input type="text" name="address" placeholder="地址" required>
        <input type="text" name="tel" placeholder="电话" required>
        <input type="text" name="type" placeholder="类型" required>
        <button type="submit">添加</button>
    </form>
    <form id="poi-delete" action="/poi-delete" method="post">
        <input type="text" name="id" placeholder="ID" required>
        <button type="submit">删除</button>
    </form>
    <form id="poi-edit" action="/poi-edit" method="post">
        <input type="text" name="id" placeholder="ID" required>
        <input type="text" name="name" placeholder="名称" required>
        <input type="text" name="address" placeholder="地址" required>
        <input type="text" name="tel" placeholder="电话" required>
        <input type="text" name="type" placeholder="类型" required>
        <button type="submit">修改</button>
    </form>
</div>
<script>
    // 获取登录按钮和登录表单元素
var showLoginFormButton = document.getElementById('show-login-form');
var loginForm = document.getElementById('login-form');

// 为登录按钮添加点击事件监听器
showLoginFormButton.addEventListener('click', function() {
    // 显示登录表单
    loginForm.style.display = 'block';
});
// 获取显示个人信息维护表单的按钮和表单元素
var showUserInfoFormButton = document.getElementById('show-user-info-form');
var userInfoForm = document.getElementById('user-info-form');

// 为显示个人信息维护表单的按钮添加点击事件监听器
showUserInfoFormButton.addEventListener('click', function() {
    // 显示个人信息维护表单
    userInfoForm.style.display = 'block';
});
// 获取显示APIKEY管理界面的按钮和界面元素
var showApikeyManagementButton = document.getElementById('show-apikey-management');
var apikeyManagement = document.getElementById('apikey-management');

// 为显示APIKEY管理界面的按钮添加点击事件监听器
showApikeyManagementButton.addEventListener('click', function() {
    // 显示APIKEY管理界面
    apikeyManagement.style.display = 'block';
});
// 获取显示POI数据管理界面的按钮和界面元素
var showPoiManagementButton = document.getElementById('show-poi-management');
var poiManagement = document.getElementById('poi-management');

// 为显示POI数据管理界面的按钮添加点击事件监听器
showPoiManagementButton.addEventListener('click', function() {
    // 显示POI数据管理界面
    poiManagement.style.display = 'block';
});
</script>
<script type="text/javascript" src="https://cache.amap.com/lbs/static/addToolbar.js"></script>
<script type="text/javascript">
    // 初始化地图
    var map = new AMap.Map('container', {
        resizeEnable: true,
        zoom: 11,
        center: [116.397428, 39.90923] // 默认北京天安门
    });
    // 定位
    map.plugin('AMap.Geolocation', function () {
        geolocation = new AMap.Geolocation({
            enableHighAccuracy: true, // 是否使用高精度定位，默认:true
            timeout: 10000, // 超过10秒后停止定位，默认：无穷大
            maximumAge: 0, // 定位结果缓存0毫秒，默认：0
            convert: true, // 自动偏移坐标，偏移后的坐标为高德坐标，默认：true
            showButton: true, // 显示定位按钮，默认：true
            buttonPosition: 'LB', // 定位按钮停靠位置，默认：'LB'，左下角
            buttonOffset: new AMap.Pixel(10, 20), // 定位按钮与设置的停靠位置的偏移量，默认：Pixel(10, 20)
            showMarker: true, // 定位成功后在定位到的位置显示点标记，默认：true
            showCircle: true, // 定位成功后用圆圈表示定位精度范围，默认：true
            panToLocation: true, // 定位成功后将定位到的位置作为地图中心点，默认：true
            zoomToAccuracy: true // 定位成功后调整地图视野范围使定位位置及精度范围视野内可见，默认：false
        });
        map.addControl(geolocation);
        geolocation.getCurrentPosition();
        AMap.event.addListener(geolocation, 'complete', onComplete); // 返回定位信息
        AMap.event.addListener(geolocation, 'error', onError); // 返回定位出错信息
    });

    // 解析定位结果
    function onComplete(data) {
        if (data.status == 1) {
            console.log("定位成功");
            $("#addressInput").val(data.formattedAddress);
            sessionStorage.setItem("dingWei-lng", data.position.getLng());
            sessionStorage.setItem("dingWei-lat", data.position.getLat());
        }
        var str = [];
        str.push('经度：' + data.position.getLng());
        str.push('纬度：' + data.position.getLat());
        str.push('是否经过偏移：' + (data.isConverted ? '是' : '否'));
        console.log(str.join('<br>'));
    }

    function onError() {
        var str = [];
        str.push('定位失败');
        console.log(str.join('<br>'));
    }
    // 输入提示和POI搜索
    AMap.plugin(['AMap.Autocomplete', 'AMap.PlaceSearch'], function(){
        var autoOptions = {
            city: "北京", // 城市，默认全国
            input: "tipinput" // 使用联想输入的input的id
        };
        var autocomplete = new AMap.Autocomplete(autoOptions);
        var placeSearch = new AMap.PlaceSearch({
            city: '北京',
            map: map
        });
        AMap.event.addListener(autocomplete, "select", function(e){
            // 针对选中的poi实现自己的功能
            placeSearch.setCity(e.poi.adcode);
            placeSearch.search(e.poi.name);
        });
    });
    //创建信息窗体
    var infoWindow = new AMap.AdvancedInfoWindow({});

    map.on('hotspotclick', function(result) {
        placeSearch.getDetails(result.id, function(status, result) {
            if (status === 'complete' && result.info === 'OK') {
                placeSearch_CallBack(result);
            }
        });
    });

    function placeSearch_CallBack(data) {
        var poiArr = data.poiList.pois;
        var location = poiArr[0].location;
        infoWindow.setContent(createContent(poiArr[0]));
        infoWindow.open(map, location); // 开启信息窗体
    }

    function createContent(poi) {
        var s = [];
        s.push('<div class="info-title">' + poi.name + '</div><div class="info-content">' + "地址：" + poi.address);
        s.push("电话：" + poi.tel);
        s.push("类型：" + poi.type);
        s.push('<div>');
        return s.join("<br>");
    }
    // 假设的数据和路径
    var data = [[{ userId: { headSculpture: 'path/to/image.jpg' } }]]; // 示例数据
        var path = 'http://example.com/'; // 图片路径
        var lng = 116.397428; // 经度
        var lat = 39.90923; // 纬度

        // 创建一个Marker实例
        var marker = new AMap.Marker({
            position: [lng, lat],
            offset: new AMap.Pixel(-21, -21), // 偏移量
            map: map
        });

        // 自定义点标记内容
        var markerContent = document.createElement("div");
        var markerImg = document.createElement("img");
        markerImg.className = "markerlnglat"; // 设置描点img的统一样式
        markerImg.src = path + data[0][0].userId.headSculpture; // 设置图片url
        markerContent.appendChild(markerImg);
        marker.setContent(markerContent);

        // 将创建的点标记添加到已有的地图实例
        map.add(marker);

        // 移除已创建的 marker
        // map.remove(marker); // 注释掉这一行，当你需要移除marker时再取消注释
</script>
</body>
</html>
